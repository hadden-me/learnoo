{{define "content"}}{{with .Data}}<h1>Se connecter</h1>
{{if .Error}}<div class="form-error" role="alert"><p>{{.Error}}</p></div>{{end}}
<form method="post" action="/login" class="form" novalidate>
<input type="hidden" name="next" value="{{.Next}}">
<div class="field"><label for="email">Adresse e-mail</label><input id="email" name="email" type="email" dir="ltr" autocomplete="username" required value="{{.Email}}"></div>
<div class="field"><label for="password">Mot de passe</label><input id="password" name="password" type="password" dir="ltr" autocomplete="current-password" required></div>
<button type="submit">Se connecter</button>
</form>
<p class="hint">Les comptes élèves sont créés sur invitation pendant le pilote. Il n’y a pas encore d’inscription publique ni de récupération de mot de passe.</p>{{end}}{{end}}
