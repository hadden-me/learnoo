{{define "content"}}{{with .Data}}<h1>{{t "login.title"}}</h1>
{{if .Error}}<div class="form-error" role="alert" id="login_error"><p>{{.Error}}</p></div>{{end}}
<form method="post" action="/login" class="form" novalidate>
<input type="hidden" name="next" value="{{.Next}}">
<div class="field"><label for="email">{{t "field.email"}}</label><input id="email" name="email" type="email" dir="ltr" autocomplete="username" required value="{{.Email}}"{{if .Error}} aria-describedby="login_error" aria-invalid="true"{{end}}></div>
<div class="field"><label for="password">{{t "field.password"}}</label><input id="password" name="password" type="password" dir="ltr" autocomplete="current-password" required{{if .Error}} aria-describedby="login_error" aria-invalid="true"{{end}}></div>
<button type="submit">{{t "login.submit"}}</button>
</form>
<p class="hint">{{t "login.hint"}}</p>{{end}}{{end}}
