{{define "content"}}{{with .Data}}<nav class="breadcrumb" aria-label="Fil d’Ariane"><a href="/learn">Mes leçons</a> › <span aria-current="page">{{.Code}}</span></nav>
<h1>{{.Code}}</h1>
{{range .Chapters}}<section class="chapter"><h2>{{if .Code}}{{.Code}}{{else}}Sans chapitre{{end}}</h2><ul class="cards">{{range .Lessons}}<li class="card"><a href="/learn/lessons/{{.PublicID}}" lang="{{.Language}}" dir="{{dir .Language}}">{{.Title}}</a></li>{{end}}</ul></section>{{end}}{{end}}{{end}}
