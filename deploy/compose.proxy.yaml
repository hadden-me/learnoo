# Reference reverse proxy (issue 87), an override of compose.production.yaml.
# NOT deployed anywhere by this repository; see docs/DEPLOYMENT.md
# ("Reference reverse proxy"). Tested locally by deploy/proxy/test-proxy.sh.
#
#   docker compose -f deploy/compose.production.yaml -f deploy/compose.proxy.yaml \
#     --env-file deploy/production.env up -d --wait
#
# With this override:
#   - Caddy (pinned by digest) terminates TLS on the frontend network, at a
#     fixed address (LEARNOO_PROXY_IPV4) in a pinned subnet;
#   - the app is no longer published on the host: only the proxy is;
#   - the app trusts X-Forwarded-For only from that one proxy address (/32).
# Defaults marked EXAMPLE are placeholders for the infrastructure maintainer.

services:
  proxy:
    image: caddy:2.11.3-alpine@sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: ${LEARNOO_LOG_MAX_SIZE:-10m}   # EXAMPLE
        max-file: ${LEARNOO_LOG_MAX_FILES:-5}    # EXAMPLE
    # Non-root, listening on 8080/8443 inside the container. The image's
    # /data/caddy and /config/caddy are world-writable (sticky), so the
    # volumes need no chown.
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    # Not used: Caddy listens on unprivileged ports, so this is the only
    # effective capability (CapEff 0x400) and nothing needs it. It
    # stays in the bounding set only because the image's caddy binary carries
    # a cap_net_bind_service file capability, and the kernel refuses to exec
    # such a binary when that capability is outside the bounding set.
    cap_add: [NET_BIND_SERVICE]
    tmpfs: [/tmp]
    environment:
      LEARNOO_PROXY_SITE: ${LEARNOO_PROXY_SITE:-localhost}
      LEARNOO_PROXY_TLS: ${LEARNOO_PROXY_TLS:-internal}
      LEARNOO_PROXY_HSTS_MAX_AGE: ${LEARNOO_PROXY_HSTS_MAX_AGE:-31536000}   # EXAMPLE
      LEARNOO_PROXY_MAX_BODY_BYTES: ${LEARNOO_PROXY_MAX_BODY_BYTES:-6291456}   # 6 MiB
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates, ACME account and (tls internal) the local CA key.
      - proxy_data:/data
      - proxy_config:/config
    networks:
      frontend:
        ipv4_address: ${LEARNOO_PROXY_IPV4:-172.30.87.10}                  # EXAMPLE
    # Host side: loopback by default for local testing. On a server, publish
    # to the public interface as 80 and 443 (for example 0.0.0.0:80 and
    # 0.0.0.0:443): the HTTP redirect always names the default https port.
    ports:
      - "${LEARNOO_PROXY_HTTP_PUBLISH:-127.0.0.1:8080}:8080"
      - "${LEARNOO_PROXY_HTTPS_PUBLISH:-127.0.0.1:8443}:8443"
    deploy:
      resources:
        limits:
          cpus: "${LEARNOO_PROXY_CPUS:-0.5}"      # EXAMPLE
          memory: ${LEARNOO_PROXY_MEMORY:-128m}   # EXAMPLE
          pids: ${LEARNOO_PROXY_PIDS:-100}        # EXAMPLE
    depends_on:
      app:
        condition: service_healthy

  app:
    # Reached only through the proxy on the frontend network.
    ports: !reset []
    environment:
      # Exactly the proxy's address; it overrides LEARNOO_TRUSTED_PROXIES
      # from the env file.
      LEARNOO_TRUSTED_PROXIES: ${LEARNOO_PROXY_IPV4:-172.30.87.10}/32
      LEARNOO_CLIENT_ADDRESS_HEADER: X-Forwarded-For

networks:
  frontend:
    ipam:
      config:
        # Pinned so the proxy address (and the app's trust) survives the
        # network being recreated. Dynamic addresses (the app) come from
        # ip_range, which must not contain LEARNOO_PROXY_IPV4.
        - subnet: ${LEARNOO_FRONTEND_SUBNET:-172.30.87.0/24}               # EXAMPLE
          ip_range: ${LEARNOO_FRONTEND_IP_RANGE:-172.30.87.128/25}         # EXAMPLE

volumes:
  proxy_data:
  proxy_config:
